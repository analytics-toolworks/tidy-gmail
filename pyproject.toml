# ============================================================
# pyproject.toml
# ============================================================

# ============================================================
# === PROJECT IDENTITY ===
# ============================================================

[project]
name = "tidy-gmail"
description = "Tidy Gmail."
readme = "README.md"
requires-python = ">=3.15"
license-files = ["LICENSE"]
dynamic = ["version"]       # WHY: Version is computed from git tags at build time.

authors = [{ name = "Denise Case" }]
keywords = [
    "gmail",
    "email",
    "email-cleanup",
    "email-organization",
    "automation",
    "privacy",
    "command-line",
    "uvx",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Topic :: Communications :: Email",
    "Topic :: Utilities",
    "Typing :: Typed",
]

dependencies = [
    "google-api-python-client", # WHY: Access Gmail messages, labels, and Trash operations.
    "google-auth-httplib2",     # WHY: Authenticated HTTP transport for Google APIs.
    "google-auth-oauthlib",     # WHY: Desktop OAuth authorization and token management.
]

# Python 3.15 includes everything else:
# - tomllib - reads TOML configuration.
# - csv - reads and writes sender decisions and reports.
# - sqlite3 - maintains persistent state.
# - pathlib - handles Windows/macOS paths.
# - argparse - supports CLI subcommands.

[project.scripts]
tidy-gmail = "tidy_gmail.cli:main"
# Enables:
# uvx tidy-gmail scan
# uvx tidy-gmail report
# uvx tidy-gmail trash

[project.urls]
Changelog = "https://github.com/analytics-toolworks/tidy-gmail/blob/main/CHANGELOG.md"
Documentation = "https://analytics-toolworks.github.io/tidy-gmail/"
Homepage = "https://github.com/analytics-toolworks/tidy-gmail"
Issues = "https://github.com/analytics-toolworks/tidy-gmail/issues"
Repository = "https://github.com/analytics-toolworks/tidy-gmail"

# ============================================================
# === DEVELOPMENT DEPENDENCIES ===
# ============================================================

[dependency-groups]
# WHY: Development dependencies support maintaining and validating the project
# but are not runtime dependencies or optional features of the published package.

dev = [
    # REQ.DEV.DEPS: External packages used for linting, testing, type checking, etc.
    "pytest",     # WHY: Test framework for unit and integration tests.
    "pytest-cov", # WHY: Test coverage reporting for quality metrics and CI gating.
    "ruff",       # WHY: Fast linting and formatting for Python code.
    "ty",         # WHY: Type checking for static analysis and type safety.
]
docs = [
    "mkdocstrings[python]", # WHY: Auto-generate API docs from docstrings.
    # REQ.DOCS.DEPS: External packages used to generate project documentation.
    "zensical",
]

# ============================================================
# === BUILD SYSTEM ===
# ============================================================
#
# REQ.PROJECT: A build system MUST be declared for package discovery and publishing.
# REQ.STRUCTURE: All importable code MUST live under src/.
# WHY src/ layout: Prevents accidental imports from the repo root and ensures
# consistent behavior across IDEs, tests, CI, and PyPI.

[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

# ============================================================
# === TOOL: HATCH ===
# ============================================================

[tool.hatch.build.hooks.vcs]
# WHY: Writes computed version into src/*/_version.py at build time.
version-file = "src/tidy_gmail/_version.py"

[tool.hatch.build.targets.sdist]
include = [
    "src/tidy_gmail",
    "CHANGELOG.md",
    "CITATION.cff",
    "LICENSE",
    "pyproject.toml",
    "README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tidy_gmail"]

[tool.hatch.version]
# Used when no git tags are present. Keep in sync with CITATION.cff.
fallback-version = "0.1.0"
# WHY: Version is derived from git tags at build time.
source = "vcs"
# WHY: Allow hatch-vcs to find the Git root from isolated build contexts.
search_parent_directories = true
tag-pattern = "^(?:v)?(?P<version>\\d+\\.\\d+\\.\\d+)$"

# ============================================================
# === TOOL: UV ===
# ============================================================

[tool.uv]
# WHY: Install all dependency groups defined by this repository by default.
# This keeps the canonical setup command identical across project types while
# allowing each repository to declare only the tooling it actually needs.
default-groups = "all"
